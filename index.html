<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria Elena Romero · Audience strategy, analytics and editorial</title>
<meta name="description" content="Portfolio of Maria Elena Romero: audience strategy, analytics, content and editorial leadership in international news and humanitarian communications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#skills">Skip to content</a>

<header id="top" class="dark">
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a href="#skills">Skills</a>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a id="nav-resume" href="#">Resume</a>
      <a id="nav-linkedin" class="icon-link" href="#" aria-label="Maria Elena Romero on LinkedIn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a class="btn btn-accent" href="#contact">Get in touch</a>
    </nav>

    <div class="hero">
      <div class="hero-text">
        <p id="intro" class="intro rise d1"></p>
        <h1 class="name rise d2"><span id="name-lead"></span> <em id="name-accent"></em></h1>
      </div>
      <div class="portrait rise d3">
        <div class="arch"></div>
        <img id="photo" alt="">
      </div>
    </div>
    <div id="facts" class="facts rise d4"></div>
  </div>
</header>

<div class="ticker" aria-label="Key results">
  <div id="ticker-track" class="track"></div>
</div>

<div class="wrap">
  <div class="worked">
    <strong>Worked with</strong>
    <span id="worked-with"></span>
  </div>
</div>

<main>
  <section id="skills" class="wrap section">
    <div class="section-head reveal">
      <h2>What I do</h2>
      <p>Open a box to see the work behind it.</p>
    </div>
    <div id="skill-grid" class="boxes"></div>
    <div id="skill-panel" class="panel" hidden></div>
  </section>

  <section id="work" class="tint">
    <div class="wrap">
      <h2 class="reveal">Selected work</h2>
      <div id="feature"></div>
      <div id="stats" class="feat3"></div>
    </div>
  </section>

  <section id="about" class="wrap section">
    <div class="two reveal">
      <h2>About</h2>
      <div class="about-body">
        <p id="about-lead" class="lead"></p>
        <div id="about-paras"></div>
        <div class="row-buttons">
          <a id="about-resume" class="btn btn-line" href="#">Download resume</a>
        </div>
      </div>
    </div>
    <div id="offclock" class="offclock reveal" hidden>
      <div class="offclock-head">
        <h3>Off the clock</h3>
        <p id="offclock-text"></p>
      </div>
      <div id="offclock-photos" class="feat3"></div>
    </div>
  </section>
</main>

<footer id="contact" class="dark">
  <div class="wrap">
    <div class="two reveal">
      <div class="contact-intro">
        <h2>Get in <em>touch</em></h2>
        <p>Use the form, or email me directly.</p>
        <a id="email-link" class="email" href="#"></a>
      </div>
      <!-- Netlify Forms: the name, data-netlify and hidden form-name fields must stay. -->
      <form name="contact" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="company">
        <input type="hidden" name="form-name" value="contact">
        <p class="hp"><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
        <div class="field">
          <label for="f-name">Your name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-email">Your email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-msg">Message</label>
          <textarea id="f-msg" name="message" rows="5" required></textarea>
        </div>
        <button class="btn btn-accent" type="submit">Send message</button>
      </form>
    </div>
    <div class="fineprint">
      <span id="copyright"></span>
      <span id="credit"></span>
    </div>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
